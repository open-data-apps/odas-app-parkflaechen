<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Hintergrund-Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7eb8f7"/>
      <stop offset="100%" stop-color="#3d3fa5"/>
    </linearGradient>
    <!-- Schatten-Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Hintergrund -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bgGrad)"/>

  <!-- Optional: Glanz-Overlay oben-links -->
  <ellipse cx="160" cy="140" rx="180" ry="160" fill="white" fill-opacity="0.07"/>

  <!-- Motiv: Parkflächen -->
  <g filter="url(#shadow)">
    <!-- P-Schild Form -->
    <rect x="146" y="126" width="220" height="260" rx="24" fill="none" stroke="#ffffff" stroke-width="28"/>
    <!-- Das "P" -->
    <path d="M 220 180 L 220 330" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
    <path d="M 220 180 L 280 180 C 310 180 320 200 320 220 C 320 240 310 260 280 260 L 220 260" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>